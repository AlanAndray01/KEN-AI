<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />

    <!--
      SEO block.
      ==========
      This app is client-rendered: the body ships as an empty #root, so anything
      a crawler is meant to read has to live here in the static HTML. Google can
      execute JavaScript before indexing, but it queues that work separately and
      other crawlers (Bing, Slack, X, LinkedIn, WhatsApp) mostly do not run it at
      all — which is why the tags below are duplicated rather than set only from
      React. `useDocumentTitle` refines the title and canonical per route once
      the app is running.
    -->
    <title>Ken AI — Private AI Assistant</title>
    <meta
      name="description"
      content="Ken AI is a private AI assistant for thinking, writing, coding, and research. Ask anything and get clear answers with worked examples — free at ken-ai.tech."
    />
    <link rel="canonical" href="https://ken-ai.tech/" />
    <meta name="author" content="Ken AI" />
    <meta name="application-name" content="Ken AI" />

    <!--
      `max-image-preview:large` is what allows the card image in Google results;
      without it Google falls back to a thumbnail or no image at all.
    -->
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />

    <!-- Open Graph: Facebook, LinkedIn, WhatsApp, Slack, Discord. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ken AI" />
    <meta property="og:title" content="Ken AI — Private AI Assistant" />
    <meta
      property="og:description"
      content="Ken AI is a private AI assistant for thinking, writing, coding, and research. Ask anything and get clear answers with worked examples."
    />
    <meta property="og:url" content="https://ken-ai.tech/" />
    <meta property="og:locale" content="en_US" />
    <!-- Absolute URL: scrapers do not resolve relative paths. -->
    <meta property="og:image" content="https://ken-ai.tech/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ken AI — ken-ai.tech" />

    <!-- X / Twitter. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ken AI — Private AI Assistant" />
    <meta
      name="twitter:description"
      content="Ken AI is a private AI assistant for thinking, writing, coding, and research. Ask anything and get clear answers with worked examples."
    />
    <meta name="twitter:image" content="https://ken-ai.tech/og-image.png" />
    <meta name="twitter:image:alt" content="Ken AI — ken-ai.tech" />

    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!--
      Structured data. `Organization` and `WebSite` together are what let Google
      treat "Ken AI" as a named entity rather than two common words, which is the
      whole problem on a brand-name search. `alternateName` covers the spellings
      people actually type.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://ken-ai.tech/#organization",
            "name": "Ken AI",
            "alternateName": ["KEN AI", "Ken", "KEN", "ken-ai.tech"],
            "url": "https://ken-ai.tech/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://ken-ai.tech/og-image.png",
              "width": 1200,
              "height": 630
            },
            "description": "Ken AI is a private AI assistant for thinking, writing, coding, and research."
          },
          {
            "@type": "WebSite",
            "@id": "https://ken-ai.tech/#website",
            "url": "https://ken-ai.tech/",
            "name": "Ken AI",
            "alternateName": ["KEN AI", "ken-ai.tech"],
            "inLanguage": "en",
            "publisher": { "@id": "https://ken-ai.tech/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://ken-ai.tech/#app",
            "name": "Ken AI",
            "url": "https://ken-ai.tech/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Any modern web browser",
            "browserRequirements": "Requires JavaScript",
            "description": "Ken AI is a private AI assistant for thinking, writing, coding, and research. It answers questions across any subject with clear explanations and worked examples.",
            "image": "https://ken-ai.tech/og-image.png",
            "publisher": { "@id": "https://ken-ai.tech/#organization" },
            "featureList": [
              "Conversational AI assistant across any subject",
              "Streaming answers with Markdown, code blocks, and LaTeX maths",
              "File and image understanding",
              "Web search and image generation tools",
              "Custom GPTs and saved memory",
              "Private conversation history with full account deletion"
            ]
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://api.ken-ai.tech" crossorigin />
    <link rel="dns-prefetch" href="https://api.ken-ai.tech" />

    <!--
      /favicon.ico is requested by crawlers and by browsers regardless of what
      is declared here, so the file has to exist: Search Console reported it as
      a 404 when only the data URI below was present. Declared first, and
      overridden by the SVG in browsers that support one.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />

    <!--
      The KEN mark: smoky-white stem, brand-green arm. Inlined as a data URI so
      the tab icon is present on first paint with no extra request.
    -->
    <link
      type="image/svg+xml"
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23121212'/%3E%3Crect x='1.6' y='1.6' width='96.8' height='96.8' rx='22.4' fill='none' stroke='%2300FF41' stroke-opacity='.42' stroke-width='2.4'/%3E%3Cg transform='translate(50 50) scale(.72) translate(-50 -50)'%3E%3Cg transform='translate(1 0) skewX(-7)'%3E%3Cpath d='M27 10h7v80H20V19z' fill='%23F5F5F5'/%3E%3Cpath d='M27 24h3v62h-3z' fill='%23121212' fill-opacity='.6'/%3E%3Cpath d='M86 10 42 50l42 40' fill='none' stroke='%2300FF41' stroke-width='14'/%3E%3Cpath d='M86 10 42 50l42 40' fill='none' stroke='%23121212' stroke-width='3.4' stroke-opacity='.5'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"
    />

    <!--
      Square PNG: iOS applies its own mask to home-screen icons, and it does not
      support an SVG apple-touch-icon at all - the data URI that used to be here
      silently failed on every iPhone.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Non-blocking font CSS: `media=print` keeps this out of the render-blocking
      set, then `onload` flips it to `all`. `display=optional` lets the first
      paint use the system stack instead of waiting on Lexend (LCP). One
      variable file covers landing's 200–800 range without five static weights.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@200..800&family=JetBrains+Mono:wght@400;500&display=optional"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@200..800&family=JetBrains+Mono:wght@400;500&display=optional"
      />
    </noscript>

    <!--
      Boot loader. Inlined so it paints on the first frame, before the module
      graph and the app stylesheet arrive. `main.tsx` removes it once React has
      painted; the landing page holds it until its hero is ready.
    -->
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #121212;
        color: #f5f5f5;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #121212;
        transition:
          opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0.35s;
      }
      #boot-loader.boot-done {
        opacity: 0;
        visibility: hidden;
      }
      #boot-loader .boot-mark {
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 0 18px rgba(0, 255, 65, 0.28));
      }
      #boot-loader .boot-mark svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #boot-loader .k-stem {
        stroke-dasharray: 76;
        stroke-dashoffset: 76;
        animation: boot-draw 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #boot-loader .k-arm {
        stroke-dasharray: 120;
        stroke-dashoffset: 120;
        animation: boot-draw 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
      }
      #boot-loader .k-fil {
        opacity: 0;
        animation: boot-fade 0.5s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
      }
      #boot-loader .boot-bar {
        position: relative;
        width: 150px;
        height: 1px;
        overflow: hidden;
        background: rgba(245, 245, 245, 0.16);
      }
      #boot-loader .boot-bar i {
        position: absolute;
        inset: 0;
        background: #00ff41;
        box-shadow: 0 0 14px rgba(0, 255, 65, 0.45);
        transform: translateX(-100%);
        animation: boot-fill 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
      }
      #boot-loader .boot-label {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #7e837e;
      }
      @keyframes boot-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes boot-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-fill {
        to {
          transform: translateX(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .k-stem,
        #boot-loader .k-arm,
        #boot-loader .k-fil,
        #boot-loader .boot-bar i {
          animation-duration: 0.01ms;
          animation-delay: 0ms;
        }
        #boot-loader {
          transition-duration: 0.01ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-label="Loading KEN">
      <div class="boot-mark" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none">
          <defs>
            <linearGradient id="bootStemG" x1="20" y1="10" x2="34" y2="90" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FFFFFF" />
              <stop offset=".55" stop-color="#F5F5F5" />
              <stop offset="1" stop-color="#A9AEA9" />
            </linearGradient>
            <linearGradient id="bootArmG" x1="88" y1="6" x2="44" y2="94" gradientUnits="userSpaceOnUse">
              <stop stop-color="#A9FFC2" />
              <stop offset=".28" stop-color="#6CFF92" />
              <stop offset=".62" stop-color="#00FF41" />
              <stop offset="1" stop-color="#00A62A" />
            </linearGradient>
          </defs>
          <g transform="translate(1 0) skewX(-7)">
            <path class="k-stem" d="M27 15V85" stroke="url(#bootStemG)" stroke-width="14" />
            <path class="k-arm" d="M86 10 42 50l42 40" stroke="url(#bootArmG)" stroke-width="14" />
            <path
              class="k-fil"
              d="M86 10 42 50l42 40"
              stroke="#121212"
              stroke-width="3.4"
              stroke-opacity=".52"
            />
          </g>
        </svg>
      </div>
      <div class="boot-bar" aria-hidden="true"><i></i></div>
      <div class="boot-label">Initialising KEN</div>
    </div>
    <div id="root"></div>

    <!--
      The only prose in the served HTML. React empties #root when it mounts, so
      body copy placed there would be invisible to a crawler that does execute
      JavaScript; inside <noscript> it survives for the crawlers that do not, and
      costs a rendering visitor nothing. Keep this factual and in step with the
      landing page — it describes the same product, it is not a keyword dump.
    -->
    <noscript>
      <main style="max-width: 46rem; margin: 0 auto; padding: 3rem 1.5rem; font-family: system-ui, sans-serif; color: #f5f5f5">
        <h1>Ken AI — a private AI assistant</h1>
        <p>
          <strong>Ken AI</strong> is an AI assistant at
          <a href="https://ken-ai.tech/" style="color: #00ff41">ken-ai.tech</a> for thinking,
          writing, coding, and research. Ask it anything — any subject, in your own language — and
          it answers in plain words, defines the terms it uses, and works through a concrete
          example rather than handing back an abstract summary.
        </p>
        <h2>What Ken AI does</h2>
        <ul>
          <li>Answers questions across any subject, from software and mathematics to business, law, health, and everyday practical problems.</li>
          <li>Streams replies with proper formatting: headings, lists, syntax-highlighted code, and LaTeX mathematics.</li>
          <li>Reads documents, spreadsheets, and images and turns them into an answer.</li>
          <li>Searches the web and generates images when a question needs them.</li>
          <li>Remembers what you ask it to remember, and forgets what you ask it to forget.</li>
          <li>Keeps your conversations private, with export and one-click deletion of your account and all its data.</li>
        </ul>
        <p>
          Ken AI needs JavaScript to run.
          <a href="https://ken-ai.tech/register" style="color: #00ff41">Create a free Ken AI account</a>
          or <a href="https://ken-ai.tech/login" style="color: #00ff41">sign in</a> to start a
          conversation.
        </p>
        <p>
          <a href="https://ken-ai.tech/privacy" style="color: #7e837e">Privacy</a> ·
          <a href="https://ken-ai.tech/terms" style="color: #7e837e">Terms</a>
        </p>
      </main>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
