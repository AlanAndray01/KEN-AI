# Render blueprint for the KEN AI Express API.
#
# The repo is an npm-workspaces monorepo, so the build runs from the REPO ROOT
# (not server/): the server imports @Ken/shared, which must be compiled first.
# Render reads the root package.json "engines" field for the Node version.
#
# Secrets are deliberately declared with `sync: false` so Render prompts for
# them in the dashboard instead of storing them in this committed file.
services:
  - type: web
    name: ken-ai-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    # `--include=dev` is required, not optional: NODE_ENV=production below makes
    # npm skip devDependencies, and the build needs typescript and @types/node
    # from there. Without it tsc fails with "Cannot find type definition file
    # for 'node'" (TS2688). Only the build needs them; the runtime does not.
    buildCommand: npm ci --include=dev && npm run build -w @Ken/shared && npm run build -w @Ken/server
    startCommand: npm run start -w @Ken/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT. server.ts binds to process.env.PORT via env.PORT.

      # Comma-separated list of allowed browser origins (see config/cors.ts).
      # Both apex and www are listed because Vercel serves both.
      - key: CLIENT_URL
        value: https://ken-ai.tech,https://www.ken-ai.tech

      # Leading dot shares the auth cookie between ken-ai.tech and
      # api.ken-ai.tech, and switches cookies to SameSite=None; Secure.
      - key: COOKIE_DOMAIN
        value: .ken-ai.tech

      - key: GOOGLE_CALLBACK_URL
        value: https://api.ken-ai.tech/api/auth/google/callback

      - key: LOG_LEVEL
        value: info

      # Never enable outside local development.
      - key: ENABLE_DEV_AUTH_TOOLS
        value: "false"
      - key: ENABLE_MOCK_AI
        value: "false"

      # ---- Set these in the Render dashboard; the app will not boot without them ----
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

      # ---- Chat engine. Gemini is the default; Groq is the next hop. ----
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # ---- Email verification + password reset (required to boot) ----
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
